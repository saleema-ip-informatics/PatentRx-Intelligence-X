[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
[project]
name = "patentrx-intelligence-x"
version = "0.4.0"
description = "Source-traceable molecular intelligence and scientific QC workbench"
requires-python = ">=3.10"
dependencies = ["rdkit"]
[project.optional-dependencies]
dev = ["pytest>=8"]
dashboard = ["streamlit>=1.35"]
[project.scripts]
patentrx = "patentrx.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests", "engine_qc"]
addopts = "--import-mode=importlib"
